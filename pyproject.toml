[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "howedo-continuity"
version = "0.0.1"
description = "Vendor-neutral continuity and integrity kernel for long-lived AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eimy Herrer" }]
dependencies = []

[project.scripts]
howedo-verify-conformance = "howedo.certification_cli:main"
howedo-build-attestation = "howedo.attestation_cli:build_main"
howedo-verify-attestation = "howedo.attestation_cli:verify_main"
howedo-verify-sigstore-trust = "howedo.trust_cli:sigstore_main"
howedo-build-certification-package = "howedo.consumer_cli:build_main"
howedo-verify-certification-package = "howedo.consumer_cli:verify_main"
howedo-fetch-consumer-trust-profile = "howedo.trust_distribution_cli:main"
howedo-build-trust-root-publication = "howedo.trust_publication_cli:build_main"
howedo-verify-trust-root-publication = "howedo.trust_publication_cli:verify_main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
langgraph = ["langgraph>=1.2,<2"]
temporal = ["temporalio>=1.31,<2"]
tuf = ["tuf>=7,<8", "securesystemslib[crypto]>=1.4,<2"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"howedo.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
