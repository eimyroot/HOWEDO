name: Canonical Channel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull-request channel
        if: github.event_name == 'pull_request'
        run: |
          test "${{ github.base_ref }}" = "main"
          echo "HOWEDO_CANONICAL_CHANNEL=PR_CANDIDATE"

      - name: Reject forced main updates
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if payload.get("forced") is True:
              raise SystemExit("HOWEDO_CANONICAL_CHANNEL=REJECT:FORCED_PUSH")
          print("HOWEDO_CANONICAL_CHANNEL=NON_FORCED_PUSH")
          PY

      - name: Verify main head is attributable to a merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100")"

          count="$(jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' <<<"${response}")"
          if [ "${count}" -lt 1 ]; then
            echo "HOWEDO_CANONICAL_CHANNEL=REJECT:NO_MERGED_PR"
            exit 1
          fi

          echo "HOWEDO_CANONICAL_CHANNEL=ACCEPT:MERGED_PR_COUNT=${count}"

      - name: Manual verification context
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "HOWEDO_CANONICAL_CHANNEL=MANUAL_OBSERVATION_ONLY"
