name: Container

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nulleimy/howedo

# Governance:
# - sha-${github.sha} is the commit-bound image tag.
# - main is a mutable convenience alias only.
# - deployments MUST use IMAGE@sha256:<digest> as authority.

jobs:
  verify:
    name: build and verify container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build verification image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: howedo:r16-ci

      - name: Verify hardened runtime
        shell: bash
        env:
          HOWEDO_SKIP_BUILD: "1"
        run: ./scripts/verify_container.sh howedo:r16-ci

  publish:
    name: publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

      - name: Attest image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify and record immutable digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          test -n "$IMAGE_DIGEST"

          case "$IMAGE_DIGEST" in
            sha256:*)
              ;;
            *)
              echo "FAIL: invalid OCI digest: $IMAGE_DIGEST"
              exit 1
              ;;
          esac

          HEX="${IMAGE_DIGEST#sha256:}"
          test "${#HEX}" -eq 64
          case "$HEX" in
            *[!0-9a-f]*)
              echo "FAIL: malformed sha256 digest"
              exit 1
              ;;
          esac

          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA}"
          IMMUTABLE_REF="${IMAGE}@${IMAGE_DIGEST}"

          echo "IMAGE=$IMAGE"
          echo "SHA_TAG=$SHA_TAG"
          echo "IMMUTABLE_REF=$IMMUTABLE_REF"
          echo "DIGEST=$IMAGE_DIGEST"

          {
            echo "### HOWEDO R16.2 OCI artifact"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${SHA_TAG}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Deployment authority: \`${IMMUTABLE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "R16_2_IMAGE_DIGEST_CONTRACT=PASS"
