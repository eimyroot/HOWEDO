name: Conformance Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-install:
    name: core import (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify zero required runtime dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          assert deps == [], f"core runtime dependencies must remain empty, got: {deps}"
          PY
      - name: Install core only
        run: python -m pip install .
      - name: Import core and adapter SDK without optional runtimes
        run: |
          python - <<'PY'
          import howedo
          import howedo.adapter_certification
          import howedo.adapter_contract
          import howedo.adapter_conformance
          import howedo.adapter_sdk
          import howedo.attestation
          import howedo.attestation_cli
          import howedo.certification_cli
          import howedo.domain
          import howedo.recovery
          import howedo.runtime
          import howedo.sigstore_trust
          import howedo.trust_cli
          import howedo.trust_policy
          print("HOWEDO_CORE_TRUST_POLICY_IMPORT=PASS")
          PY

  profile-conformance:
    name: ${{ matrix.profile }} (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        profile: ["dev", "postgres", "langgraph", "temporal", "all"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: howedo
          POSTGRES_PASSWORD: howedo
          POSTGRES_DB: howedo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howedo -d howedo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOWEDO_TEST_POSTGRES_DSN: postgresql://howedo:howedo@localhost:5432/howedo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install profile
        shell: bash
        run: |
          case "${{ matrix.profile }}" in
            dev)       python -m pip install -e '.[dev]' ;;
            postgres)  python -m pip install -e '.[dev,postgres]' ;;
            langgraph) python -m pip install -e '.[dev,langgraph]' ;;
            temporal)  python -m pip install -e '.[dev,temporal]' ;;
            all)       python -m pip install -e '.[dev,postgres,langgraph,temporal]' ;;
          esac
      - name: Verify optional import boundary
        shell: bash
        run: |
          case "${{ matrix.profile }}" in
            postgres)
              python -c 'from howedo.storage.postgres import PostgresStorageAdapter; print("POSTGRES_ADAPTER_IMPORT=PASS")'
              ;;
            langgraph)
              python -c 'from howedo.adapters.langgraph import LangGraphRuntimeAdapter; from howedo.adapters.langgraph_v1 import LangGraphRuntimeAdapterV1; print("LANGGRAPH_ADAPTER_V1_IMPORT=PASS")'
              ;;
            temporal)
              python -c 'from howedo.adapters.temporal import TemporalRuntimeAdapter; from howedo.adapters.temporal_v1 import TemporalRuntimeAdapterV1; print("TEMPORAL_ADAPTER_V1_IMPORT=PASS")'
              ;;
            all)
              python -c 'from howedo.storage.postgres import PostgresStorageAdapter; from howedo.adapters.langgraph_v1 import LangGraphRuntimeAdapterV1; from howedo.adapters.temporal_v1 import TemporalRuntimeAdapterV1; print("ALL_ADAPTER_V1_IMPORTS=PASS")'
              ;;
            dev)
              python -c 'import howedo; import howedo.adapter_sdk; import howedo.trust_policy; print("DEV_CORE_TRUST_POLICY_IMPORT=PASS")'
              ;;
          esac
      - name: Ruff
        run: ruff check .
      - name: Full test suite
        run: pytest
      - name: Freeze protocol-v1 schema filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {
              "continuity-event.schema.json",
              "continuity-snapshot.schema.json",
              "recovery-checkpoint.schema.json",
              "resource-revision.schema.json",
              "witness-record.schema.json",
          }
          actual = {p.name for p in Path("schemas/v1").glob("*.json")}
          assert actual == expected, f"protocol-v1 schema drift: {sorted(actual)}"
          print("PROTOCOL_V1_SCHEMA_SET=PASS")
          PY
      - name: Freeze runtime-adapter-v1 schema filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {
              "adapter-manifest.schema.json",
              "failure.schema.json",
              "runtime-identity.schema.json",
          }
          actual = {p.name for p in Path("schemas/runtime-adapter-v1").glob("*.json")}
          assert actual == expected, f"runtime-adapter-v1 schema drift: {sorted(actual)}"
          print("RUNTIME_ADAPTER_V1_SCHEMA_SET=PASS")
          PY
      - name: Freeze adapter-conformance-v1 schema filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {"conformance-artifact.schema.json"}
          actual = {p.name for p in Path("schemas/adapter-conformance-v1").glob("*.json")}
          assert actual == expected, f"adapter-conformance-v1 schema drift: {sorted(actual)}"
          print("ADAPTER_CONFORMANCE_V1_SCHEMA_SET=PASS")
          PY
      - name: Freeze attestation-v1 schema filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {"conformance-attestation.schema.json"}
          actual = {p.name for p in Path("schemas/attestation-v1").glob("*.json")}
          assert actual == expected, f"attestation-v1 schema drift: {sorted(actual)}"
          print("ATTESTATION_V1_SCHEMA_SET=PASS")
          PY
      - name: Freeze trust-policy-v1 schema filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {"attestation-trust-policy.schema.json"}
          actual = {p.name for p in Path("schemas/trust-policy-v1").glob("*.json")}
          assert actual == expected, f"trust-policy-v1 schema drift: {sorted(actual)}"
          print("TRUST_POLICY_V1_SCHEMA_SET=PASS")
          PY

  langgraph-integration:
    name: langgraph conformance artifact (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HOWEDO_CONFORMANCE_ARTIFACT_DIR: artifacts
      HOWEDO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install LangGraph profile
        run: python -m pip install -e '.[dev,langgraph]'
      - name: Ruff
        run: ruff check .
      - name: Generate LangGraph conformance artifact
        run: pytest tests/integration/test_langgraph_adapter_v1.py
      - name: Verify generated artifact with core CLI
        run: |
          artifact="$(find artifacts -name 'langgraph-*.json' -print -quit)"
          test -n "$artifact"
          howedo-verify-conformance "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: howedo-langgraph-conformance-${{ matrix.python-version }}
          path: artifacts/*.json
          if-no-files-found: error

  temporal-integration:
    name: temporal real integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HOWEDO_TEST_TEMPORAL: "1"
      HOWEDO_CONFORMANCE_ARTIFACT_DIR: artifacts
      HOWEDO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Temporal profile
        run: python -m pip install -e '.[dev,temporal]'
      - name: Ruff
        run: ruff check .
      - name: Real Temporal safe-resume and adapter-v1 conformance
        run: pytest tests/integration/test_temporal_adapter.py tests/integration/test_temporal_adapter_v1.py
      - name: Verify generated artifact with core CLI
        run: |
          artifact="$(find artifacts -name 'temporal-*.json' -print -quit)"
          test -n "$artifact"
          howedo-verify-conformance "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: howedo-temporal-conformance-${{ matrix.python-version }}
          path: artifacts/*.json
          if-no-files-found: error

  signed-attestation:
    name: keyless signed conformance attestations
    runs-on: ubuntu-latest
    needs: [langgraph-integration, temporal-integration]
    permissions:
      contents: read
      id-token: write
    env:
      HOWEDO_SIGNER_IDENTITY: https://github.com/${{ github.workflow_ref }}
      HOWEDO_SIGNER_ISSUER: https://token.actions.githubusercontent.com
      HOWEDO_TRUST_POLICY: ${{ github.event_name == 'pull_request' && 'policies/test/github-actions-pr-conformance-trust-v1.json' || 'policies/reference/github-actions-conformance-trust-v1.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HOWEDO core
        run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          pattern: howedo-*-conformance-*
          path: r9-artifacts
          merge-multiple: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build and semantically verify in-toto statements
        run: |
          mkdir -p signed-attestations
          count=0
          for artifact in r9-artifacts/*.json; do
            base="$(basename "$artifact" .json)"
            statement="signed-attestations/${base}.intoto.json"
            howedo-verify-conformance "$artifact"
            howedo-build-attestation "$artifact" "$statement"
            howedo-verify-attestation "$artifact" "$statement"
            count=$((count + 1))
          done
          test "$count" -eq 4
      - name: Keyless sign statements with GitHub OIDC
        run: |
          for statement in signed-attestations/*.intoto.json; do
            bundle="${statement%.intoto.json}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$statement"
          done
      - name: Verify signer identity, workflow claims, and semantic binding
        run: |
          count=0
          for statement in signed-attestations/*.intoto.json; do
            base="$(basename "$statement" .intoto.json)"
            artifact="r9-artifacts/${base}.json"
            bundle="${statement%.intoto.json}.sigstore.json"
            cosign verify-blob "$statement" \
              --bundle "$bundle" \
              --certificate-identity "$HOWEDO_SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$HOWEDO_SIGNER_ISSUER" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME"
            howedo-verify-attestation "$artifact" "$statement"
            count=$((count + 1))
          done
          test "$count" -eq 4
      - name: Evaluate R11 trust policy and emit in-toto SVR receipts
        run: |
          count=0
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for statement in signed-attestations/*.intoto.json; do
            base="$(basename "$statement" .intoto.json)"
            artifact="r9-artifacts/${base}.json"
            bundle="${statement%.intoto.json}.sigstore.json"
            receipt="signed-attestations/${base}.svr.json"
            howedo-verify-sigstore-trust \
              --artifact "$artifact" \
              --statement "$statement" \
              --bundle "$bundle" \
              --policy "$HOWEDO_TRUST_POLICY" \
              --issuer "$HOWEDO_SIGNER_ISSUER" \
              --identity "$HOWEDO_SIGNER_IDENTITY" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow ".github/workflows/consolidation.yml" \
              --execution-sha "$GITHUB_SHA" \
              --execution-ref "$GITHUB_REF" \
              --trigger "$GITHUB_EVENT_NAME" \
              --time-created "$created" \
              --evidence-ref "github-actions://run/${GITHUB_RUN_ID}" \
              --evidence-ref "sigstore://bundle/${base}" \
              --output "$receipt"
            count=$((count + 1))
          done
          test "$count" -eq 4
          python - <<'PY'
          import json
          from pathlib import Path
          receipts = sorted(Path("signed-attestations").glob("*.svr.json"))
          assert len(receipts) == 4
          for path in receipts:
              data = json.loads(path.read_text())
              assert data["predicateType"] == "https://in-toto.io/attestation/svr/v0.2"
              assert "HOWEDO_ATTESTATION_TRUST_ACCEPTED" in data["predicate"]["properties"]
          print("HOWEDO_R11_TRUST_RECEIPTS=4_ACCEPTED")
          PY
      - name: Keyless sign and verify R11 SVR receipts
        run: |
          count=0
          for receipt in signed-attestations/*.svr.json; do
            bundle="${receipt%.svr.json}.svr.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$receipt"
            cosign verify-blob "$receipt" \
              --bundle "$bundle" \
              --certificate-identity "$HOWEDO_SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$HOWEDO_SIGNER_ISSUER" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME"
            count=$((count + 1))
          done
          test "$count" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: howedo-signed-conformance-attestations
          path: |
            r9-artifacts/*.json
            signed-attestations/*.json
          if-no-files-found: error
