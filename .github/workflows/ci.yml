name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: howedo
          POSTGRES_PASSWORD: howedo
          POSTGRES_DB: howedo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howedo -d howedo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOWEDO_TEST_POSTGRES_DSN: postgresql://howedo:howedo@localhost:5432/howedo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,api,postgres,langgraph,temporal,tuf,release]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Build and verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/howedo-release-smoke
          mkdir -p dist/python dist/evidence

          python -m build --outdir dist/python
          python -m twine check dist/python/*

          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          WHEEL="$(find dist/python -maxdepth 1 -type f -name '*.whl' -print -quit)"
          SDIST="$(find dist/python -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$WHEEL"
          test -n "$SDIST"

          python -m venv /tmp/howedo-release-smoke
          /tmp/howedo-release-smoke/bin/python -m pip install --no-deps "$WHEEL"
          /tmp/howedo-release-smoke/bin/python - <<PY
          from importlib.metadata import version
          import howedo
          assert version("howedo-continuity") == "${VERSION}"
          assert howedo is not None
          PY

          SBOM="dist/evidence/howedo-continuity-${VERSION}.cdx.json"
          cyclonedx-py environment \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file "$SBOM" \
            /tmp/howedo-release-smoke/bin/python

          COMMIT="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          WHEEL_REL="${WHEEL#dist/}"
          SDIST_REL="${SDIST#dist/}"
          SBOM_REL="${SBOM#dist/}"
          MANIFEST="dist/evidence/howedo-continuity-${VERSION}.release.json"

          howedo-build-release-bundle \
            --root dist \
            --version "$VERSION" \
            --tag "v${VERSION}" \
            --git-commit "$COMMIT" \
            --git-tree "$TREE" \
            --wheel "$WHEEL_REL" \
            --sdist "$SDIST_REL" \
            --sbom "$SBOM_REL" \
            --output "$MANIFEST"

          howedo-verify-release-bundle \
            "$MANIFEST" \
            --root dist \
            --expected-tag "v${VERSION}" \
            --expected-commit "$COMMIT" \
            --expected-tree "$TREE"
