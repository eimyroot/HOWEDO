name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: howedo
          POSTGRES_PASSWORD: howedo
          POSTGRES_DB: howedo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howedo -d howedo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOWEDO_TEST_POSTGRES_DSN: postgresql://howedo:howedo@localhost:5432/howedo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,postgres]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
