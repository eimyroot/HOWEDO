name: R12 Consumer Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  consumer-replay:
    name: replay canonical R11 evidence
    runs-on: ubuntu-latest
    env:
      HOWEDO_R11_SOURCE_RUN_ID: "31992072790"
      HOWEDO_R11_SOURCE_SHA: "9b33854b54d902bc32d68beae92cffaff9d2f49d"
      HOWEDO_R11_SOURCE_REF: "refs/heads/main"
      HOWEDO_R11_SOURCE_TRIGGER: "push"
      HOWEDO_R11_SOURCE_IDENTITY: "https://github.com/nulleimy/HOWEDO/.github/workflows/consolidation.yml@refs/heads/main"
      HOWEDO_R11_SOURCE_ISSUER: "https://token.actions.githubusercontent.com"
      HOWEDO_R11_POLICY: "policies/reference/github-actions-conformance-trust-v1.json"
      HOWEDO_CONSUMER_PROFILE: "policies/reference/github-actions-consumer-trust-v1.json"
      HOWEDO_EXPECTED_CONSUMER_PROFILE_DIGEST: "sha256:312018c9e05bfdb9ffddf0f71ad80c3002ab185c90cc605e3295a2a0dd34d5a5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify zero-dependency consumer boundary
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"].get("dependencies", []) == []
          print("HOWEDO_R12_CORE_DEPENDENCIES=ZERO")
          PY

      - name: Install HOWEDO core
        run: python -m pip install .

      - name: Import R12 consumer modules
        run: |
          python - <<'PY'
          import howedo.certification_package
          import howedo.consumer_cli
          import howedo.consumer_trust
          print("HOWEDO_R12_CONSUMER_IMPORT=PASS")
          PY

      - name: Freeze R12 schema filenames and reference profile digest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_consumer = {"consumer-trust-profile.schema.json"}
          actual_consumer = {
              path.name for path in Path("schemas/consumer-trust-v1").glob("*.json")
          }
          assert actual_consumer == expected_consumer

          expected_package = {"certification-package.schema.json"}
          actual_package = {
              path.name for path in Path("schemas/certification-package-v1").glob("*.json")
          }
          assert actual_package == expected_package

          profile = json.loads(Path(os.environ["HOWEDO_CONSUMER_PROFILE"]).read_text())
          assert profile["profile_digest"] == os.environ[
              "HOWEDO_EXPECTED_CONSUMER_PROFILE_DIGEST"
          ]
          assert profile["expected_workflow_name"] == "Conformance Matrix"
          print("HOWEDO_R12_SCHEMA_AND_PROFILE_FREEZE=PASS")
          PY

      - name: Download canonical R11 production evidence
        uses: actions/download-artifact@v5
        with:
          name: howedo-signed-conformance-attestations
          path: r11-evidence
          github-token: ${{ github.token }}
          repository: nulleimy/HOWEDO
          run-id: ${{ env.HOWEDO_R11_SOURCE_RUN_ID }}

      - name: Verify canonical R11 fixture shape
        run: |
          test "$(find r11-evidence -type f -name '*.json' | wc -l)" -eq 20
          test "$(find r11-evidence/r9-artifacts -type f -name '*.json' | wc -l)" -eq 4
          test "$(find r11-evidence/signed-attestations -type f -name '*.intoto.json' | wc -l)" -eq 4
          test "$(find r11-evidence/signed-attestations -type f -name '*.svr.json' | wc -l)" -eq 4
          echo "HOWEDO_R12_R11_FIXTURE=20_JSON"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build and independently replay four consumer packages
        run: |
          mkdir -p certification-packages
          count=0
          for statement in r11-evidence/signed-attestations/*.intoto.json; do
            base="$(basename "$statement" .intoto.json)"
            package="certification-packages/${base}"

            howedo-build-certification-package \
              --artifact "r11-evidence/r9-artifacts/${base}.json" \
              --statement "$statement" \
              --statement-bundle "r11-evidence/signed-attestations/${base}.sigstore.json" \
              --policy "$HOWEDO_R11_POLICY" \
              --svr "r11-evidence/signed-attestations/${base}.svr.json" \
              --svr-bundle "r11-evidence/signed-attestations/${base}.svr.sigstore.json" \
              --issuer "$HOWEDO_R11_SOURCE_ISSUER" \
              --identity "$HOWEDO_R11_SOURCE_IDENTITY" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow ".github/workflows/consolidation.yml" \
              --execution-sha "$HOWEDO_R11_SOURCE_SHA" \
              --execution-ref "$HOWEDO_R11_SOURCE_REF" \
              --trigger "$HOWEDO_R11_SOURCE_TRIGGER" \
              --evidence-ref "github-actions://run/${HOWEDO_R11_SOURCE_RUN_ID}" \
              --evidence-ref "sigstore://bundle/${base}" \
              --output-dir "$package"

            howedo-verify-certification-package "$package" \
              --profile "$HOWEDO_CONSUMER_PROFILE" \
              --expected-profile-digest "$HOWEDO_EXPECTED_CONSUMER_PROFILE_DIGEST"

            count=$((count + 1))
          done

          test "$count" -eq 4
          test "$(find certification-packages -name manifest.json | wc -l)" -eq 4
          echo "HOWEDO_R12_CONSUMER_PACKAGES=4_ACCEPTED"

      - name: Verify package file cardinality
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = sorted(Path("certification-packages").iterdir())
          assert len(roots) == 4
          expected = {
              "artifact.json",
              "manifest.json",
              "policy.json",
              "statement.intoto.json",
              "statement.sigstore.json",
              "svr.json",
              "svr.sigstore.json",
          }
          for root in roots:
              assert {path.name for path in root.iterdir()} == expected
          print("HOWEDO_R12_PACKAGE_FILES=4x7")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: howedo-r12-consumer-certification-packages
          path: certification-packages/**
          if-no-files-found: error
